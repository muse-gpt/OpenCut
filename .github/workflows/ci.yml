name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    name: build and verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install
      - run: pnpm run build
      # Loading the addon and validating a production is the cross-platform
      # gate: the scene contract and the painter run on every host.
      - run: node projects/packages/open-cut/dist/cli.js validate projects/films/promotional/design-tokens.ts
      # MP4 encoding runs through Media Foundation, so the render/verify gate
      # is Windows-only until another encoder backend lands upstream.
      - if: matrix.os == 'windows-latest'
        run: node projects/packages/open-cut/dist/cli.js render projects/films/promotional/design-tokens.ts --out design-tokens.mp4
      - if: matrix.os == 'windows-latest'
        run: node projects/packages/open-cut/dist/cli.js verify projects/films/promotional/design-tokens.ts --out design-tokens.mp4 --json
      - if: matrix.os == 'windows-latest'
        run: node projects/packages/open-cut/dist/cli.js render projects/films/promotional/chart-demo.ts --out chart-demo.mp4
      - if: matrix.os == 'windows-latest'
        run: node projects/packages/open-cut/dist/cli.js verify projects/films/promotional/chart-demo.ts --out chart-demo.mp4 --json
