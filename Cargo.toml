[workspace]
resolver = "2"
members = ["projects/crates/napi"]
default-members = ["projects/crates/napi"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["OpenCut Authors"]
repository = "https://github.com/nyar-os/OpenCut"

[workspace.dependencies]
serde_json = "1"
# Cross-repo git dependencies must pin the full 40-character revision.
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "f92f818fde7174154d77a87b55a5e44b367034c9" }
# The renderer lives upstream. The revision is pinned to a full 40-character
# commit so any checkout resolves the exact same source; bump it deliberately.
media = { git = "https://github.com/oovm/boost.rs.git", rev = "5e859e3fc3ef50e3304bd766b8b4058541df325b" }

[profile.release]
lto = true
panic = "abort"

